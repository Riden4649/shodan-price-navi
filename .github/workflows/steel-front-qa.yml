name: Steel Front V2 QA
on:
  push:
    branches: [main]
    paths:
      - 'steel-front/**'
      - '.github/workflows/steel-front-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check steel-front/v2/game.js
      - name: Test fog, hex, HQ mechanics
        run: node steel-front/v2/qa.test.cjs
