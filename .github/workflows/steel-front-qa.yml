name: Steel Front QA
on:
  push:
    branches: [main]
    paths:
      - 'steel-front/**'
      - '.github/workflows/steel-front-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check V2 JavaScript syntax
        run: node --check steel-front/v2/game.js
      - name: V2 regression
        run: node steel-front/v2/qa.test.cjs
      - name: Check V3 JavaScript syntax
        run: node --check steel-front/v3/game.js
      - name: V3 tactical victory tests
        run: node steel-front/v3/qa.test.cjs
